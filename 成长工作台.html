<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6d5ae0">
<title>成长工作台 · 每日时间表 × 最小动作 × 统计复盘</title>
<!--
  成长工作台 · 单文件本地版 v3
  - 四个板块：今日（时间表 + 8 条最小动作 + 今日核对 + 成功日记）、统计（核心数据 + 周复盘 + 月视图）、参考（阶段目标）、我的
  - 达标定义：当日 8 条最小动作全部打勾
  - 数据保存在浏览器 localStorage，不连任何外部接口，断网可用
  - 所有 CSS/JS 内联，图标与图表全部手写内联 SVG，无 emoji、无外部依赖
-->
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f6f7fb;--card:#ffffff;--ink:#22283a;--ink2:#7a8095;--line:#e8eaf3;
  --pri:#6d5ae0;--pri2:#9b7bff;--pri-soft:#efeaff;
  --grad:linear-gradient(135deg,#6d5ae0,#9b7bff);
  --ok:#1ca35a;--okbg:#e7f6ee;--okline:#bfe6cf;
  --danger:#d93a45;--redbg:#fdeeee;--redline:#f6c9cc;
  --amber:#e8940a;--amberbg:#fdf4e3;--amberline:#f2dca6;
  --shadow:0 2px 12px rgba(50,50,105,.08);--r:14px;
}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55}
.hidden{display:none!important}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink)}
.ic{width:1.15em;height:1.15em;vertical-align:-.22em;flex:none}

/* ===== 布局 ===== */
#app{min-height:100vh}
#main{max-width:1180px;margin:0 auto;padding:16px 14px calc(92px + env(safe-area-inset-bottom))}
.sidebar{display:none;position:fixed;left:0;top:0;bottom:0;width:224px;background:var(--card);border-right:1px solid var(--line);padding:22px 14px;flex-direction:column;gap:22px;z-index:40}
.topnav-wrap{display:none;position:sticky;top:0;z-index:40;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:10px 18px;align-items:center;justify-content:space-between;gap:12px}
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(255,255,255,.97);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.nav{display:flex;gap:4px;width:100%}
.sidebar .nav{flex-direction:column;align-items:stretch;gap:4px}
.sidebar .nav-item{width:100%}
.nav-item{display:flex;align-items:center;gap:8px;min-height:44px;padding:8px 14px;border-radius:12px;color:var(--ink2);font-weight:600;white-space:nowrap;transition:.15s}
.nav-item.active{background:var(--pri-soft);color:var(--pri)}
.nav-item:active{transform:scale(.97)}
.bottomnav .nav-item{flex:1;flex-direction:column;gap:2px;font-size:10.5px;padding:6px 0;justify-content:center;min-height:52px}
.bottomnav .nav-item .ic{width:21px;height:21px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;border-radius:12px;background:var(--grad);display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.logo .ic{width:22px;height:22px}
.brand b{display:block;font-size:15px;line-height:1.2}
.brand span{display:block;font-size:11px;color:var(--ink2)}
.brand-sm{display:flex;align-items:center;gap:8px;font-weight:700}
.brand-sm .logo{width:32px;height:32px}
.side-foot{margin-top:auto;font-size:12px;color:var(--ink2);border-top:1px dashed var(--line);padding-top:12px;line-height:1.7}
@media(min-width:768px){.topnav-wrap{display:flex}.bottomnav{display:none}#main{padding-bottom:40px}}
@media(min-width:1100px){.sidebar{display:flex}.topnav-wrap{display:none}#main{margin-left:224px}}

/* ===== 通用 ===== */
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.page-head h1{font-size:23px;letter-spacing:.5px}
.page-head .sub{font-size:13px;color:var(--ink2);margin-top:2px}
.sec-title{display:flex;align-items:center;gap:8px;font-size:16px;margin:20px 0 10px;color:var(--ink);flex-wrap:wrap}
.sec-title .right{margin-left:auto;display:flex;align-items:center;gap:6px}
.sec-title .ic{color:var(--pri)}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.muted{color:var(--ink2)}
.small{font-size:12.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:0 16px;border-radius:12px;font-weight:700;font-size:15px;transition:.15s;border:1px solid transparent}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--grad);color:#fff;box-shadow:0 4px 14px rgba(109,90,224,.32)}
.btn.ghost{background:#fff;border-color:var(--line);color:var(--ink)}
.btn.danger{background:var(--danger);color:#fff}
.btn.sm{min-height:38px;padding:0 13px;font-size:13.5px;border-radius:10px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:10px;color:var(--ink2);flex:none}
.icon-btn .ic{width:18px;height:18px}
.icon-btn:hover{background:var(--pri-soft);color:var(--pri)}
.chip{display:inline-block;background:var(--pri-soft);color:var(--pri);font-size:11.5px;font-weight:600;border-radius:99px;padding:2px 9px}
.tag-red{background:var(--redbg);color:var(--danger);font-size:11.5px;font-weight:700;border-radius:99px;padding:2px 9px;white-space:nowrap}
.tag-amber{background:var(--amberbg);color:var(--amber);font-size:11.5px;font-weight:700;border-radius:99px;padding:2px 9px;white-space:nowrap}
.tag-ok{background:var(--okbg);color:var(--ok);font-size:11.5px;font-weight:700;border-radius:99px;padding:2px 9px;white-space:nowrap}
.tag-gray{background:#eef0f6;color:var(--ink2);font-size:11.5px;font-weight:600;border-radius:99px;padding:2px 9px;white-space:nowrap}
.banner-note{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--pri-soft);border:1px solid #d9ceff;border-radius:12px;padding:10px 14px;margin-bottom:14px;color:#4a3ba8;font-size:13.5px}
.banner-note .btn{margin-left:auto}
.banner-note .ic{width:18px;height:18px;flex:none}

/* ===== 今日：打卡统计横幅 ===== */
.hero{background:var(--grad);border-radius:var(--r);padding:14px 14px 13px;color:#fff;margin-bottom:14px;box-shadow:0 6px 18px rgba(109,90,224,.35)}
.hero-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hero-top>b{font-size:17px;letter-spacing:.5px}
.hero-date{margin-left:auto;display:flex;align-items:center;gap:4px}
.hero-date .hd-btn{width:32px;height:32px;border-radius:9px;background:rgba(255,255,255,.18);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.hero-date .hd-btn:active{transform:scale(.94)}
.hero-date .hd-btn:disabled{opacity:.35}
.hero-date .hd-day{font-size:14px;font-weight:800;min-width:104px;text-align:center;background:none;border:none;color:#fff;cursor:default}
.hero-date .hd-day.clickable{cursor:pointer;text-decoration:underline dotted rgba(255,255,255,.7);text-underline-offset:4px}
.hero-grid{display:grid;grid-template-columns:92px repeat(3,1fr);gap:8px;margin-top:11px}
@media(max-width:360px){.hero-grid{grid-template-columns:repeat(2,1fr)}.hero-ring{grid-column:span 2}}
.hero-ring{background:rgba(255,255,255,.15);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:9px 4px;gap:2px}
.hero-ring .hr-sub{font-size:10.5px;opacity:.9;font-weight:600}
.hero-cell{background:rgba(255,255,255,.15);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 4px;text-align:center;min-height:74px}
.hero-cell b{font-size:22px;line-height:1.1;font-variant-numeric:tabular-nums}
.hero-cell span{font-size:10.5px;opacity:.9;margin-top:4px;font-weight:600}
.hero-tip{font-size:11px;opacity:.85;margin-top:9px;display:flex;align-items:center;gap:5px}

/* ===== 今日：时间表 ===== */
.today-grid{display:grid;grid-template-columns:1fr;gap:14px}
.tl-card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:8px 14px 12px;margin-bottom:14px}
.tl-head{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;padding:8px 2px 10px;flex-wrap:wrap}
.tl-head .ic{color:var(--pri)}
.tl-head .now{margin-left:auto;font-size:12px;font-weight:600;color:var(--ink2);display:flex;align-items:center;gap:5px}
.tl-row{display:grid;grid-template-columns:88px 1fr;gap:10px;padding:8px 6px;border-top:1px dashed var(--line);position:relative;align-items:flex-start}
.tl-row:first-of-type{border-top:none}
.tl-time{font-size:12.5px;font-weight:700;color:var(--ink2);font-variant-numeric:tabular-nums;padding-top:1px;white-space:nowrap}
.tl-name{font-size:14px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.tl-name i{width:8px;height:8px;border-radius:99px;flex:none}
.tl-sub{font-size:11.5px;color:var(--ink2);margin-top:1px}
.tl-row.past{opacity:.55}
.tl-row.now-row{background:linear-gradient(90deg,#f3efff,rgba(243,239,255,0));border-radius:10px}
.tl-row.now-row .tl-time{color:var(--pri)}
.tl-flag{font-size:10.5px;font-weight:800;color:#fff;background:var(--pri);border-radius:6px;padding:1px 6px}
.tl-row.rest .tl-name{color:var(--ink2)}
.tl-marker{font-size:10.5px;font-weight:700;color:var(--ink2);background:#f1f2f7;border-radius:6px;padding:1px 6px}

/* ===== 今日：核对条 ===== */
.check-bar{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;margin-bottom:14px;flex-wrap:wrap}
.check-bar .cb-num{font-size:30px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-1px}
.check-bar .cb-num span{font-size:14px;font-weight:600;color:var(--ink2);letter-spacing:0}
.check-bar .cb-txt{flex:1;min-width:150px}
.check-bar .cb-txt b{display:block;font-size:14px}
.check-bar .cb-txt span{font-size:12px;color:var(--ink2)}
.ring{flex:none}

/* ===== 今日：最小动作 ===== */
.act-list{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;margin-bottom:14px}
.act-item{display:flex;align-items:flex-start;gap:12px;padding:13px 15px;border-top:1px solid var(--line);cursor:pointer;transition:.15s;width:100%;text-align:left;min-height:60px}
.act-item:first-child{border-top:none}
.act-item:active{background:#fafaff}
.act-item.done{background:#fbfdfc}
.box{width:24px;height:24px;border-radius:7px;border:2px solid #c9cede;display:flex;align-items:center;justify-content:center;color:#fff;flex:none;margin-top:2px;transition:.15s;background:#fff}
.box .ic{width:14px;height:14px;opacity:0}
.act-item.done .box{background:var(--ok);border-color:var(--ok)}
.act-item.done .box .ic{opacity:1}
.act-txt{flex:1;min-width:0}
.act-title{display:block;font-size:14.5px;font-weight:700;line-height:1.5}
.act-title i{display:inline-block;width:8px;height:8px;border-radius:99px;margin-right:7px;vertical-align:1px}
.act-std{display:block;font-size:12px;color:var(--ink2);margin-top:3px;line-height:1.55}
.act-item.done .act-title{color:#5b7f6a}
.act-item.done .act-std{color:#93a89c}
.act-item.done .act-title,.act-item.done .act-std{text-decoration:line-through;text-decoration-color:rgba(91,127,106,.35)}

/* ===== 今日：成功日记 ===== */
.diary-card{background:linear-gradient(150deg,#fffdf6,#fff8ec);border:1px solid #f3e3c4;border-radius:var(--r);padding:14px;margin-bottom:14px}
.diary-card h3{font-size:15px;display:flex;align-items:center;gap:7px;color:#a2731a}
.diary-card h3 .ic{color:#e8940a}
.diary-card .dsub{font-size:12px;color:#a08a63;margin:2px 0 10px}
.diary-row{display:flex;align-items:center;gap:9px;margin-top:8px}
.diary-row .dn{width:22px;height:22px;border-radius:99px;background:#f6e6c8;color:#a2731a;font-size:11.5px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.diary-row input{flex:1;min-width:0;border:1px solid #efe2c9;background:#fff;border-radius:10px;padding:9px 12px;min-height:42px}
.diary-row input:focus{outline:2px solid #f7dfae;border-color:#e8c37a}
.diary-row input::placeholder{color:#c0b49c}

/* ===== 统计 ===== */
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
@media(min-width:768px){.stat-grid{grid-template-columns:repeat(4,1fr)}}
.stat-card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px}
.stat-card .sc-top{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2);font-weight:600}
.stat-card .sc-top .ic{width:15px;height:15px;color:var(--c,var(--pri))}
.stat-card .sc-num{font-size:27px;font-weight:800;letter-spacing:-1px;margin-top:6px;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--c,var(--ink))}
.stat-card .sc-num em{font-size:13px;font-weight:600;color:var(--ink2);font-style:normal;letter-spacing:0;margin-left:3px}
.stat-card .sc-note{font-size:11.5px;color:var(--ink2);margin-top:3px}
.wk-nav{display:flex;align-items:center;gap:4px;margin-left:auto}
.wk-nav b{font-size:13px;min-width:106px;text-align:center;color:var(--ink2)}
.kv-list{display:flex;flex-direction:column;gap:10px}
.kv-row{display:flex;align-items:center;gap:10px}
.kv-row .kv-l{font-size:12.5px;color:var(--ink2);width:88px;flex:none}
.kv-row .kv-track{flex:1;height:8px;background:#eef0f7;border-radius:99px;overflow:hidden}
.kv-row .kv-track i{display:block;height:100%;border-radius:99px;background:var(--c,var(--pri))}
.kv-row .kv-v{font-size:12px;font-weight:700;min-width:52px;text-align:right;font-variant-numeric:tabular-nums}
.wk-fields{display:grid;grid-template-columns:1fr;gap:10px}
.wk-field b{font-size:13px;color:var(--pri);display:flex;align-items:center;gap:6px}
.wk-field textarea{display:block;width:100%;margin-top:6px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fbfbfe;min-height:64px;resize:vertical;line-height:1.6}
.wk-field textarea:focus{outline:2px solid #d6ccff;border-color:var(--pri)}
@media(min-width:768px){.wk-fields{grid-template-columns:1fr 1fr}}

/* 月视图 */
.cal-head{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.cal-head b{font-size:15px}
.cal-head .wk-nav{margin-left:auto}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-dow{text-align:center;font-size:11px;color:var(--ink2);font-weight:700;padding-bottom:2px}
.cal-cell{aspect-ratio:1/1;border-radius:9px;border:1px solid var(--line);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12.5px;color:var(--ink2);position:relative;min-height:40px}
.cal-cell.empty{background:transparent;border:none}
.cal-cell.full{background:var(--danger);border-color:var(--danger);color:#fff;font-weight:700}
.cal-cell.part{background:#fbdcde;border-color:#f3c3c6;color:#a8343c;font-weight:700}
.cal-cell.none{background:#fff}
.cal-cell.today{outline:2px solid var(--pri);outline-offset:-2px}
.cal-cell .cd{font-weight:600}
.cal-cell .cn{font-size:9.5px;opacity:.85;font-weight:700}
.cal-cell.future{background:#fafbfe;color:#c2c7d6}
.cal-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--ink2)}
.cal-legend span{display:flex;align-items:center;gap:5px}
.cal-legend i{width:13px;height:13px;border-radius:4px;display:inline-block;border:1px solid var(--line)}

/* ===== 参考 ===== */
.ref-grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:900px){.ref-grid{grid-template-columns:1fr 1fr}}
.ref-card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:15px;border-left:4px solid var(--c,var(--pri));position:relative}
.ref-card h3{font-size:15px;display:flex;align-items:center;gap:7px;color:var(--c,var(--pri));padding-right:36px}
.ref-card h3 .ic{width:17px;height:17px}
.ref-card .rf-goal{font-size:14px;margin-top:8px;line-height:1.6}
.ref-card .rf-acts{margin-top:9px;padding-top:9px;border-top:1px dashed var(--line)}
.ref-card .rf-acts li{list-style:none;font-size:12.5px;color:#4a5068;display:flex;gap:6px;margin-top:5px;line-height:1.5}
.ref-card .rf-acts li::before{content:"";width:5px;height:5px;border-radius:99px;background:var(--c,var(--pri));margin-top:7px;flex:none;opacity:.6}
.ref-card .rf-edit{position:absolute;top:9px;right:7px}
.ref-tip{background:var(--pri-soft);border:1px solid #d9ceff;border-radius:12px;padding:12px 14px;font-size:13px;color:#4a3ba8;line-height:1.65}
.ref-tip b{color:#3b2d8f}

/* ===== 我的 ===== */
.list-card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;margin-bottom:14px}
.li-row{display:flex;align-items:center;gap:12px;padding:13px 15px;border-top:1px solid var(--line);width:100%;text-align:left;min-height:56px}
.li-row:first-child{border-top:none}
.li-row .li-ic{width:34px;height:34px;border-radius:10px;background:var(--pri-soft);color:var(--pri);display:flex;align-items:center;justify-content:center;flex:none}
.li-row .li-ic .ic{width:17px;height:17px}
.li-row .li-t{flex:1;min-width:0}
.li-row .li-t b{display:block;font-size:14.5px}
.li-row .li-t span{display:block;font-size:12px;color:var(--ink2);margin-top:1px}
.li-row .li-arrow{color:#c2c7d6;flex:none}
.danger-zone{border:1.5px dashed #f0b6ba;background:var(--redbg);border-radius:12px;padding:12px;margin-bottom:14px}
.danger-zone b{font-size:13.5px;color:#8c2f36;display:flex;align-items:center;gap:6px}
.danger-zone p{font-size:12.5px;color:#9a5459;margin-top:3px}
.danger-zone .row2{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:9px}
.danger-zone input{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;min-height:44px;width:100%}
.howto{display:grid;grid-template-columns:1fr;gap:10px;margin-top:4px}
@media(min-width:768px){.howto{grid-template-columns:1fr 1fr}}
.howto>div{background:#f8f8fd;border-radius:10px;padding:12px}
.howto b{font-size:13px}
.howto ol{margin:7px 0 0 18px;font-size:13px;color:#4a5068}
.howto li{margin:4px 0;line-height:1.55}

/* ===== 弹层 / 表单 ===== */
.mask{position:fixed;inset:0;background:rgba(25,20,50,.45);z-index:100;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
.modal{background:#fff;border-radius:18px 18px 0 0;width:100%;max-width:560px;max-height:88vh;overflow:auto;padding:18px 18px calc(20px + env(safe-area-inset-bottom));animation:mUp .22s ease}
@keyframes mUp{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@media(min-width:768px){.mask{align-items:center;padding:20px}.modal{border-radius:18px}}
.m-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.m-head b{font-size:16px}
.m-hint{font-size:12.5px;color:var(--ink2);background:var(--pri-soft);border-radius:10px;padding:8px 10px;margin-top:8px;line-height:1.6}
.m-warn{font-size:14px;color:#5a3033;background:var(--redbg);border-radius:10px;padding:12px;margin-top:8px;display:flex;gap:8px;align-items:flex-start;line-height:1.6}
.m-warn .ic{color:var(--danger);margin-top:2px;flex:none}
.m-btns{display:flex;gap:10px;margin-top:18px}
.m-btns .btn{flex:1}

<script>
'use strict';
/* ============ 工具 ============ */
const KEY = 'wb_growth_v3';
const LEGACY_KEYS = ['wb_growth_v2', 'wb_growth_v1'];
let state = null, curTab = 'today', viewWeek = null, viewMonth = null, pendingImport = null, saveTimer = null;

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad = n => n < 10 ? '0' + n : '' + n;
const dstr = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const todayStr = () => dstr(new Date());
function addDays(s, n) { const d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() + n); return dstr(d); }
function dowOf(s) { return new Date(s + 'T00:00:00').getDay(); }
function mondayOf(s) { return addDays(s, -((dowOf(s) + 6) % 7)); }
function diffDays(a, b) { return Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 864e5); }
function fmtMD(s) { const p = s.split('-'); return (+p[1]) + '月' + (+p[2]) + '日'; }
function monthKey(s) { return s.slice(0, 7); }
function monthLabel(k) { const p = k.split('-'); return p[0] + '年' + (+p[1]) + '月'; }
function daysInMonth(k) { const y = +k.split('-')[0], m = +k.split('-')[1]; return new Date(y, m, 0).getDate(); }
function weekdayCn(s) { return '周' + '日一二三四五六'[dowOf(s)]; }
function fmtNum(n) { return (+n || 0).toLocaleString('zh-CN'); }
function clamp(n, a, b) { return Math.max(a, Math.min(b, n)); }

/* ============ 8 条最小动作（含执行标准） ============ */
const MODULES = {

const DEFAULT_ACTS = () => ([

  { id: 'a_tcm',   module: 'tcm',   name: '中医养生：打造个人 IP；口播 1 条 / 天。', std: '标准：拍摄并发布 1 条口播，不追求完美，先发出去', time: '11:30' },
  { id: 'a_read',  module: 'read',  name: '读书：月读 ≥2 本；笔记 1 条 / 天。', std: '标准：笔记 1 条（≥50 字摘录或感想），读多少记多少', time: '19:30' },
  { id: 'a_stock', module: 'stock', name: '股票：复盘 ≤1h，学习游资心法。', std: '标准：60 分钟内结束，只写学习结论，不记盈亏情绪', time: '18:00' },

  { id: 'a_mind',  module: 'mind',  name: '情绪：拒绝内耗。', std: '标准：觉察到反刍就写下触发场景，3 分钟内拉回当下', time: '21:00' },
  { id: 'a_money', module: 'money', name: '财务：掌握收支流向。', std: '标准：当天支出全部记账，顺手看一眼本月结余', time: '21:00' }
]);

/* ============ 每日时间表 ============ */
const TIMETABLE = [

  { s: '09:00', e: '11:30', name: '课题攻坚', note: '实验 / 文献 / 规划', module: 'lab' },

  { s: '17:00', e: '18:00', name: '晚餐', note: '', module: '', rest: true },

];

/* ============ 图标（内联 SVG） ============ */
const ICONS = {

  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',

  edit: '<path d="M4 20h4L19.5 8.5a2.1 2.1 0 0 0-3-3L5 17v3z"/>',
  trash: '<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
  download: '<path d="M12 3v12M7 10l5 5 5-5M4 21h16"/>',
  upload: '<path d="M12 15V3M7 8l5-5 5 5M4 21h16"/>',
  x: '<path d="M6 6l12 12M18 6L6 18"/>',
  left: '<path d="M15 5l-7 7 7 7"/>',
  right: '<path d="M9 5l7 7-7 7"/>',
  copy: '<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V4h10"/>',
  info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8v.5"/>',
  book: '<path d="M4 5a2 2 0 0 1 2-2h13v18H6a2 2 0 0 1-2-2V5z"/><path d="M8 3v18"/>',
  mic: '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',
  flask: '<path d="M9 3h6M10 3v5l-5 9a2 2 0 0 0 1.7 3h10.6A2 2 0 0 0 19 17l-5-9V3"/><path d="M7.5 14h9"/>',
  trend: '<path d="M3 17l5-5 4 3 6-7"/><path d="M18 8h3v3"/>',
  dumbbell: '<path d="M6 8v8M3 10v4M18 8v8M21 10v4M6 12h12"/>',
  wallet: '<path d="M3 7a2 2 0 0 1 2-2h12v4"/><rect x="3" y="7" width="18" height="12" rx="2"/><circle cx="16.5" cy="13" r="1.2"/>',
  brain: '<path d="M9 4a3 3 0 0 0-3 3 3 3 0 0 0-1 5.8V16a3 3 0 0 0 4 2.8V4z"/><path d="M15 4a3 3 0 0 1 3 3 3 3 0 0 1 1 5.8V16a3 3 0 0 1-4 2.8V4z"/>',
  spark: '<path d="M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2 2-6z"/>',
  calendar: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  flag: '<path d="M5 21V4h11l-2 4 2 4H5"/>',
  target: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/>',
  fire: '<path d="M12 3c3 4 5 6 5 9a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3 0-5 1-8z"/>',
  home: '<path d="M3 11l9-8 9 8"/><path d="M5 10v11h14V10"/>',
  refresh: '<path d="M20 11a8 8 0 1 0-2.3 6.3"/><path d="M20 4v7h-7"/>',
  protect: '<path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3z"/><path d="M9 12l2 2 4-4"/>'
};
function icon(n) { return '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICONS[n] || ICONS.info) + '</svg>'; }

/* ============ 数据层 ============ */
function emptyData() {
  return { version: 3, acts: DEFAULT_ACTS(), checks: {}, read: {}, video: {}, diary: {}, weekly: {}, goals: defaultGoals(), startDate: todayStr() };
}
function migrate(d) {
  d = d || {};
  d.version = 3;
  d.acts = (d.acts && d.acts.length ? d.acts : DEFAULT_ACTS());
  d.checks = d.checks || {};
  d.read = d.read || {};
  d.video = d.video || {};
  d.diary = d.diary || {};
  d.weekly = d.weekly || {};
  d.goals = (d.goals && d.goals.length ? d.goals : defaultGoals());
  d.startDate = d.startDate || todayStr();
  return d;
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { toast('保存失败：浏览器存储不可用', 'warn'); } }
function saveSoon() { clearTimeout(saveTimer); saveTimer = setTimeout(save, 320); }

/* ============ 阶段目标参考（可在「参考」页编辑） ============ */
function defaultGoals() {
  return [
    { id: 'g_ielts', module: 'ielts', title: '雅思目标', headline: '6 个月内达到目标分数（7.0+），每周完成一套真题模考',
      acts: ['每周 1 套完整真题模考，严格计时', '每日单词 60 个 + 精听 1 段不断线', '口语每周 2 次录音自查，写作每周 1 篇批改'] },
    { id: 'g_read', module: 'read', title: '读书目标', headline: '每月精读 ≥2 本书，累计输出笔记 ≥24 篇',
      acts: ['每天笔记 1 条，读完一本整理一篇长笔记', '月读 2 本，一本偏专业一本偏通识', '每季度回看一次笔记，挑 3 条落到行动'] },
    { id: 'g_body', module: 'body', title: '形体目标', headline: '体脂率下降 X%，胸围增加 X cm，掌握 3 个核心复合动作',
      acts: ['每周 ≥4 次训练，每次 30 分钟以上', '掌握深蹲 / 硬拉 / 卧推三个复合动作的标准姿势', '每月同角度拍照 + 量围度，只对比三月前'] },
    { id: 'g_stock', module: 'stock', title: '股票目标', headline: '建立稳定盈利模式，每月复盘总结交易得失',
      acts: ['每日复盘 ≤1 小时，只写学习结论不记盈亏情绪', '每周整理一次游资心法笔记', '每月末做一次月度交易复盘，只改规则不改心态'] },
    { id: 'g_lab', module: 'lab', title: '课题目标', headline: '按期完成实验 / 文献进度，无重大延期',
      acts: ['每日更新进度规划，哪怕只写一行', '每周锁一个必须交付的实验节点', '每月对照里程碑检查一次，延期就当场改计划'] }
  ];
}

/* ============ 计算层 ============ */
function actIds() { return state.acts.map(a => a.id); }
function checksOf(d) { return state.checks[d] || []; }
function isFull(d) { const ids = actIds(); return ids.length > 0 && ids.every(id => checksOf(d).indexOf(id) >= 0); }
function doneCount(d) { return checksOf(d).filter(id => actIds().indexOf(id) >= 0).length; }
function hasAny(d) { return doneCount(d) > 0; }
function dayStatus(d) { const n = doneCount(d); if (n === 0) return 'none'; return n >= state.acts.length ? 'full' : 'part'; }
/* 连续达标：今天未达标时从昨天起算（当天还有机会，不算断） */
function streakDays() {
  const T = todayStr();
  let cursor = isFull(T) ? T : addDays(T, -1);
  let n = 0;
  for (let i = 0; i < 3650; i++) {
    if (isFull(cursor)) { n++; cursor = addDays(cursor, -1); } else break;
  }
  return n;
}
function totalFullDays() { return Object.keys(state.checks).filter(d => isFull(d)).length; }
function readTotal() { return Object.keys(state.read).reduce((s, k) => s + (+state.read[k] || 0), 0); }
function videoTotal() { return Object.keys(state.video).reduce((s, k) => s + (+state.video[k] || 0), 0); }
function readOf(d) { return +state.read[d] || 0; }
function videoOf(d) { return +state.video[d] || 0; }
function rangeDays(from, to) { const out = []; let c = from; while (c <= to) { out.push(c); c = addDays(c, 1); } return out; }
function weekDays(mon) { return rangeDays(mon, addDays(mon, 6)); }

function weekStats(mon) {
  const days = weekDays(mon);
  let checks = 0, full = 0, read = 0, video = 0, active = 0;
  days.forEach(d => {
    const n = doneCount(d); checks += n; read += readOf(d); video += videoOf(d);
    if (n > 0) active++;
    if (isFull(d)) full++;
  });
  const perAct = state.acts.map(a => ({ id: a.id, name: MODULES[a.module] ? MODULES[a.module].name : a.name, module: a.module, n: days.filter(d => checksOf(d).indexOf(a.id) >= 0).length }));
  return { checks, full, read, video, active, perAct };
}

/* ============ 基础 UI ============ */
let toastTimer = null;
function toast(msg, kind) {
  const t = $('#toast'); t.textContent = msg; t.className = 'toast ' + (kind || '');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.className = 'toast hidden'; }, 2600);
}
function openModal(html) { $('#modalRoot').innerHTML = '<div class="mask"><div class="modal">' + html + '</div></div>'; }
function closeModal() { $('#modalRoot').innerHTML = ''; }
function confetti() {
  const layer = $('#confettiLayer');
  const colors = ['#6d5ae0', '#9b7bff', '#1ca35a', '#f0a01e', '#ef8f2f', '#0e9f8a', '#e05a9b'];
  for (let i = 0; i < 60; i++) {
    const el = document.createElement('div'); el.className = 'cf';
    el.style.left = (Math.random() * 100) + '%';
    el.style.background = colors[i % colors.length];
    el.style.animationDelay = (Math.random() * 0.5) + 's';
    el.style.animationDuration = (2 + Math.random() * 1.6) + 's';
    layer.appendChild(el);
    setTimeout(() => el.remove(), 4200);
  }
}
function ring(pct, size, stroke, color, label, track) {
  const r = (size - stroke) / 2, c = 2 * Math.PI * r;
  const off = c * (1 - clamp(pct, 0, 1));
  return '<svg class="ring" width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '">' +
    '<circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke="' + (track || '#eef0f7') + '" stroke-width="' + stroke + '"/>' +
    '<circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke="' + color + '" stroke-width="' + stroke + '" stroke-linecap="round" stroke-dasharray="' + c.toFixed(1) + '" stroke-dashoffset="' + off.toFixed(1) + '" transform="rotate(-90 ' + size / 2 + ' ' + size / 2 + ')"/>' +
    (label ? '<text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" font-size="' + Math.round(size * 0.26) + '" font-weight="800" fill="' + color + '">' + label + '</text>' : '') +
    '</svg>';
}

/* ============ 导航 / 统一刷新 ============ */
function renderNav() {
  const items = [['today', '今日', 'sun'], ['stats', '统计', 'chart'], ['ref', '参考', 'compass'], ['mine', '我的', 'user']];
  const html = items.map(it => '<button class="nav-item' + (curTab === it[0] ? ' active' : '') + '" data-action="tab" data-tab="' + it[0] + '">' + icon(it[2]) + '<span>' + it[1] + '</span></button>').join('');
  $('#navSide').innerHTML = html;
  $('#navTop').innerHTML = html;
  $('#navBottomInner').innerHTML = html;
}
function renderBanner() {
  const b = $('#banner'), T = todayStr();
  const n = doneCount(T), total = state.acts.length;
  /* 今日页已有打卡横幅，这里只在其他页提醒进度 */
  if (curTab !== 'today' && n > 0 && n < total) {
    b.innerHTML = '<div class="banner-note">' + icon('info') + '<span>今天已完成 <b>' + n + ' / ' + total + '</b> 项，还差 ' + (total - n) + ' 项就满格。</span></div>';
    b.classList.remove('hidden');
  } else { b.classList.add('hidden'); b.innerHTML = ''; }
}
/* 统一刷新入口：渲染函数之间禁止互相调用 */
function refreshAll() {
  renderNav();
  renderBanner();
  renderToday();
  renderStats();
  renderRef();
  renderMine();
}
function switchTab(id) {
  curTab = id;
  document.querySelectorAll('.page').forEach(p => p.classList.toggle('hidden', p.id !== 'page-' + id));
  /* 切页时按当前数据重渲染目标页，避免看到过期数字 */
  if (id === 'today') renderToday();
  else if (id === 'stats') renderStats();

function renderTimeTable() {
  const nm = nowMin();
  let current = -1;
  TIMETABLE.forEach((r, i) => { if (nm >= toMin(r.s) && nm < toMin(r.e)) current = i; });
  const rows = TIMETABLE.map((r, i) => {
    const s = toMin(r.s), e = toMin(r.e);
    let cls = 'tl-row';
    if (r.rest) cls += ' rest';
    if (nm >= e) cls += ' past';
    if (i === current) cls += ' now-row';
    const m = r.module && MODULES[r.module];
    const dot = m ? '<i style="background:' + m.color + '"></i>' : '';
    const flag = i === current ? '<span class="tl-flag">进行中</span>' : '';
    const marker = r.point ? '<span class="tl-marker">固定</span>' : '';
    const time = r.point ? r.s : (r.s + ' – ' + r.e);
    return '<div class="' + cls + '" data-s="' + r.s + '" data-e="' + r.e + '">' +
      '<div class="tl-time">' + time + '</div>' +
      '<div><div class="tl-name">' + dot + esc(r.name) + flag + marker + '</div>' +
      (r.note ? '<div class="tl-sub">' + esc(r.note) + '</div>' : '') + '</div></div>';

/* 周报文本 */
function buildWeekText(mon) {
  const s = weekStats(mon), T = todayStr();
  const wdata = state.weekly[mon] || { obstacle: '', plan: '' };
  const prev = weekStats(addDays(mon, -7));
  const cmp = (a, b, unit) => {
    const d = a - b;
    if (!b && !a) return '与上周持平（均为 0）';
    if (d === 0) return '与上周持平（' + b + unit + '）';
    return (d > 0 ? '比上周多 ' + d : '比上周少 ' + (-d)) + unit;
  };
  const lines = [];
  lines.push('【' + fmtMD(mon) + '–' + fmtMD(addDays(mon, 6)) + ' 周复盘】');
  lines.push('');
  lines.push('■ 数据概览');
  lines.push('· 达标天数：' + s.full + ' / 7 天，' + cmp(s.full, prev.full, ' 天'));
  lines.push('· 打卡项次：' + s.checks + ' 项，' + cmp(s.checks, prev.checks, ' 项'));
  lines.push('· 读书时长：' + s.read + ' 分钟，' + cmp(s.read, prev.read, ' 分钟'));
  lines.push('· 发布视频：' + s.video + ' 条，' + cmp(s.video, prev.video, ' 条'));
  lines.push('· 有行动的天数：' + s.active + ' / 7 天');
  lines.push('');
  lines.push('■ 各动作完成情况');
  s.perAct.forEach(p => { lines.push('· ' + p.name + '：' + p.n + ' / 7 天'); });
  const weak = s.perAct.slice().sort((a, b) => a.n - b.n).filter(p => p.n < 5);
  lines.push('');
  lines.push('■ 本周最薄弱');
  lines.push(weak.length ? weak.slice(0, 3).map(p => p.name + '（' + p.n + ' 天）').join('、') + '——下周优先补这一项。' : '没有明显薄弱项，8 项都保持了 5 天以上。');
  lines.push('');
  lines.push('■ 障碍与对策');
  lines.push('本周阻碍：' + (wdata.obstacle && wdata.obstacle.trim() ? wdata.obstacle.trim() : '（还没填写）'));
  lines.push('下周方案：' + (wdata.plan && wdata.plan.trim() ? wdata.plan.trim() : '（还没填写）'));
  lines.push('');
  lines.push('■ 下周只锁一件事');
  lines.push(weak.length ? '把「' + weak[0].name + '」从 ' + weak[0].n + ' 天提到 5 天，其余保持就好。' : '维持现有节奏，不加新任务。');
  return lines.join('\n');
}

}

/* ================= 弹窗 ================= */
function copyText(txt) {
  if (navigator.clipboard && window.isSecureContext) { navigator.clipboard.writeText(txt).then(() => toast('已复制到剪贴板', 'ok'), () => fallbackCopy(txt)); }
  else fallbackCopy(txt);
}
function fallbackCopy(txt) {
  const ta = document.createElement('textarea');
  ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  let ok = false; try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  ta.remove(); toast(ok ? '已复制到剪贴板' : '复制失败，请长按选中文本复制', ok ? 'ok' : 'warn');
}
function openActsEditor() {
  const rows = state.acts.map((a, i) => '<div class="act-block" data-id="' + a.id + '">' +
    '<div style="display:flex;align-items:center;gap:8px;padding-top:10px">' +
    '<b style="font-size:13px;color:var(--ink2)">第 ' + (i + 1) + ' 条</b>' +
    '<button type="button" class="icon-btn" data-action="delActRow" style="margin-left:auto;width:32px;height:32px" aria-label="删除">' + icon('trash') + '</button></div>' +
    '<input class="ac-name" value="' + esc(a.name) + '" placeholder="雅思：每日背单词 60 个 + 精听 1 段材料。" style="width:100%;margin-top:6px;border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:#fbfbfe">' +
    '<input class="ac-std" value="' + esc(a.std) + '" placeholder="执行标准（标题下方的灰色小字）" style="width:100%;margin-top:6px;border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:#fbfbfe;font-size:14px">' +
    '<input class="ac-time" value="' + esc(a.time || '') + '" placeholder="对应时间 09:00（仅记录，不在今日页显示）" style="width:100%;margin-top:6px;border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:#fbfbfe;font-size:14px">' +
    '</div>').join('');
  openModal('<div class="m-head"><b>编辑最小动作</b><button class="icon-btn" data-action="closeModal" aria-label="关闭">' + icon('x') + '</button></div>' +
    '<p class="small muted">第一行是加粗标题（按「雅思：具体动作」写，冒号会显示成空格），第二行是灰色小字执行标准。达标标准是「全部打勾」，建议保持 6–8 条。</p>' +
    '<form id="actsForm"><div style="max-height:52vh;overflow:auto;padding-right:2px">' + rows + '</div>' +
    '<div class="m-hint">已经打过的勾不会因为改名而丢失。删掉一条，历史上的这一项也会一并隐藏。</div>' +
    '<div class="m-btns"><button type="button" class="btn ghost" data-action="closeModal">取消</button>' +
    '<button type="submit" class="btn pri">保存</button></div></form>');
}
function openGoalEditor(gid) {
  const g = state.goals.find(x => x.id === gid);
  if (!g) return;
  openModal('<div class="m-head"><b>编辑阶段目标</b><button class="icon-btn" data-action="closeModal" aria-label="关闭">' + icon('x') + '</button></div>' +
    '<form id="goalForm"><input type="hidden" name="gid" value="' + g.id + '">' +
    '<label>标题<input name="title" value="' + esc(g.title) + '" maxlength="20"></label>' +
    '<label>目标（可验收的结果）<textarea name="headline" maxlength="120">' + esc(g.headline) + '</textarea></label>' +
    '<label>关键动作（一行一条，最多 4 条）<textarea name="acts" style="min-height:88px">' + esc((g.acts || []).join('\n')) + '</textarea></label>' +
    '<div class="m-btns"><button type="button" class="btn ghost" data-action="closeModal">取消</button>' +
    '<button type="submit" class="btn pri">保存</button></div></form>');
}
function openDayDetail(ds) {
  const n = doneCount(ds), total = state.acts.length;
  const dia = (state.diary[ds] || []).filter(x => x && x.trim());
  const list = state.acts.map(a => {
    const ok = checksOf(ds).indexOf(a.id) >= 0;
    const p = splitActName(a.name);
    const t = p[1] ? p[0] + ' ' + p[1] : p[0];
    return '<div style="display:flex;align-items:flex-start;gap:8px;padding:7px 0;border-top:1px dashed var(--line)">' +
      '<span style="color:' + (ok ? 'var(--ok)' : '#c9cede') + ';flex:none;margin-top:2px">' + icon(ok ? 'check' : 'x') + '</span>' +
      '<span style="font-size:13.5px;' + (ok ? '' : 'color:var(--ink2)') + '">' + esc(t) + '</span></div>';
  }).join('');
  openModal('<div class="m-head"><b>' + fmtMD(ds) + ' ' + weekdayCn(ds) + '</b><button class="icon-btn" data-action="closeModal" aria-label="关闭">' + icon('x') + '</button></div>' +
    '<p style="margin-bottom:8px"><b style="font-size:20px;color:' + (n >= total ? 'var(--ok)' : 'var(--pri)') + '">' + n + ' / ' + total + '</b>' +
    '<span class="small muted" style="margin-left:6px">' + (n >= total && total > 0 ? '达标日' : n > 0 ? '未完成' : '未打卡') + '</span></p>' +
    list +
    '<div style="margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)">' +
    '<div class="small muted">读书 ' + readOf(ds) + ' 分钟 · 发布视频 ' + videoOf(ds) + ' 条</div>' +
    (dia.length ? '<div style="margin-top:8px;background:#fffdf6;border:1px solid #f3e3c4;border-radius:10px;padding:10px;font-size:13px;color:#7a6032">' +
      dia.map((x, i) => '<div style="margin-top:' + (i ? '4px' : '0') + '">· ' + esc(x) + '</div>').join('') + '</div>' : '<div class="small muted" style="margin-top:6px">这天没写成功日记</div>') +
    '</div>' +
    '<div class="m-btns"><button class="btn ghost" data-action="closeModal">关闭</button></div>');
}
function openWeekText() {
  const mon = viewWeek || mondayOf(todayStr());
  const txt = buildWeekText(mon);
  openModal('<div class="m-head"><b>本周总结</b><button class="icon-btn" data-action="closeModal" aria-label="关闭">' + icon('x') + '</button></div>' +
    '<p class="small muted" style="margin-bottom:8px">自动用你的勾选数据生成，括号里的内容来自「障碍与对策」。</p>' +
    '<div class="txt-out" id="weekTextOut">' + esc(txt) + '</div>' +
    '<div class="m-btns"><button class="btn ghost" data-action="closeModal">关闭</button>' +
    '<button class="btn pri" data-action="copyWeekText">' + icon('copy') + '复制文本</button></div>');
  window.__weekText = txt;
}
function openHowto() { switchTab('mine'); toast('已跳到「我的」页，按步骤添加即可'); }

/* ================= 事件 ================= */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const a = el.dataset.action;
  switch (a) {
    case 'tab': switchTab(el.dataset.tab); break;
    case 'closeModal': closeModal(); break;
    case 'heroPrev': heroDate = addDays(heroDate || todayStr(), -1); renderToday(); break;
    case 'heroNext': {
      const nd = addDays(heroDate || todayStr(), 1);
      if (nd <= todayStr()) { heroDate = (nd === todayStr() ? null : nd); renderToday(); }
      break;
    }
    case 'heroToday': if (heroDate) { heroDate = null; renderToday(); } break;
    case 'toggleAct': toggleAct(el.dataset.aid); break;
    case 'editActs': openActsEditor(); break;
    case 'delActRow': { const row = el.closest('.act-block'); if (row) row.remove(); break; }
    case 'editGoal': openGoalEditor(el.dataset.gid); break;
    case 'weekPrev': viewWeek = addDays(viewWeek || mondayOf(todayStr()), -7); renderStats(); break;
    case 'weekNext': {
      const cur = viewWeek || mondayOf(todayStr());
      const next = addDays(cur, 7);
      if (next <= mondayOf(todayStr())) { viewWeek = next; renderStats(); }
      break;
    }
    case 'monthPrev': { const mk = viewMonth || monthKey(todayStr()); viewMonth = monthKey(addDays(mk + '-01', -1)); renderStats(); break; }
    case 'monthNext': { const mk = viewMonth || monthKey(todayStr()); viewMonth = monthKey(addDays(mk + '-28', 7)); renderStats(); break; }
    case 'genWeek': openWeekText(); break;
    case 'copyWeekText': copyText(window.__weekText || ''); break;
    case 'dayDetail': openDayDetail(el.dataset.date); break;
    case 'howto': openHowto(); break;
    case 'exportJSON': exportJSON(); break;
    case 'importJSON': $('#importFile').click(); break;
    case 'migrateOld': doMigrate(); break;
    case 'confirmMigrate': confirmMigrateRun(); break;
    case 'clearAll': doClearAll(); break;
    case 'confirmClear': {
      try { localStorage.removeItem(KEY); } catch (err) { }
      state = emptyData(); save(); closeModal();
      viewWeek = mondayOf(todayStr()); viewMonth = monthKey(todayStr());
      refreshAll(); toast('已清空，重新开始', 'ok');
      break;
    }
    case 'confirmImport': {
      if (!pendingImport) { closeModal(); break; }
      state = migrate(pendingImport);
      pendingImport = null; save(); closeModal();
      viewWeek = mondayOf(todayStr()); viewMonth = monthKey(todayStr());
      refreshAll(); toast('导入完成', 'ok');
      break;
    }
  }
});

/* 输入：即时保存 */
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset && t.dataset.di !== undefined) {
    const T = todayStr();
    const arr = state.diary[T] || (state.diary[T] = ['', '', '']);
    while (arr.length < 3) arr.push('');
    arr[+t.dataset.di] = t.value;
    saveSoon();
    return;
  }
  if (t.dataset && t.dataset.wk) {
    const mon = viewWeek || mondayOf(todayStr());
    const w = state.weekly[mon] || (state.weekly[mon] = { obstacle: '', plan: '' });
    w[t.dataset.wk] = t.value;
    saveSoon();
    return;
  }
  if (t.dataset && t.dataset.metric) {
    const T = todayStr(), v = Math.max(0, Math.floor(+t.value || 0));
    if (v > 0) state[t.dataset.metric === 'read' ? 'read' : 'video'][T] = v;
    else { delete state[t.dataset.metric === 'read' ? 'read' : 'video'][T]; }
    saveSoon();
    refreshMetricCards();
  }
});

/* 表单提交 */
document.addEventListener('submit', e => {
  const f = e.target;
  if (f.id === 'actsForm') {
    e.preventDefault();
    const acts = [];
    f.querySelectorAll('.act-block').forEach(blk => {
      const name = (blk.querySelector('.ac-name').value || '').trim();
      if (!name) return;
      const std = (blk.querySelector('.ac-std').value || '').trim();
      const tm = (blk.querySelector('.ac-time').value || '').trim();
      const oldId = blk.dataset.id;
      const old = state.acts.find(x => x.id === oldId);
      acts.push({ id: oldId, module: old ? old.module : 'lab', name: name, std: std, time: tm });
    });
    if (!acts.length) { toast('至少要保留 1 条最小动作', 'warn'); return; }
    state.acts = acts.map((a, i) => { a.name = a.name.replace(/^第\s*\d+\s*条\s*/, ''); return a; });
    save(); closeModal(); refreshAll(); toast('已保存 ' + acts.length + ' 条最小动作', 'ok');
    return;
  }
  if (f.id === 'goalForm') {
    e.preventDefault();
    const gid = f.gid.value;
    const g = state.goals.find(x => x.id === gid);
    if (!g) return;
    g.title = (f.title.value || '').trim() || g.title;
    g.headline = (f.headline.value || '').trim();
    g.acts = (f.acts.value || '').split('\n').map(s => s.trim()).filter(Boolean).slice(0, 4);
    save(); closeModal(); renderRef(); toast('目标已更新', 'ok');
  }
});

/* ================= 数据导入导出 ================= */
function exportJSON() {
  const data = JSON.stringify(state, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = '成长工作台-' + todayStr() + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  toast('已导出备份文件', 'ok');
}
function doImport(file) {
  const reader = new FileReader();
  reader.onload = () => {
    let d = null;
    try { d = JSON.parse(reader.result); } catch (err) { toast('文件格式不对，不是有效的 JSON', 'warn'); return; }
    if (!d || typeof d !== 'object' || !d.acts) { toast('这份文件里没有找到工作台数据', 'warn'); return; }
    pendingImport = d;
    const actN = (d.acts || []).length;
    const dayN = Object.keys(d.checks || {}).length;
    openModal('<div class="m-head"><b>确认导入</b><button class="icon-btn" data-action="closeModal" aria-label="关闭">' + icon('x') + '</button></div>' +
      '<div class="m-warn">' + icon('info') + '<div><b>导入会覆盖当前全部数据</b><br>文件里有 ' + actN + ' 条最小动作、' + dayN + ' 天打卡记录。当前数据将不可恢复，建议先导出备份。</div></div>' +
      '<div class="m-btns"><button class="btn ghost" data-action="closeModal">取消</button>' +
      '<button class="btn danger" data-action="confirmImport">确认覆盖导入</button></div>');
  };
  reader.readAsText(file);
}
function doMigrate() {
  const found = LEGACY_KEYS.filter(k => { try { return !!localStorage.getItem(k); } catch (e) { return false; } });
  if (!found.length) { toast('没有检测到旧版本数据', 'warn'); return; }
  let days = 0;
  try {
    const old = JSON.parse(localStorage.getItem(found[0]) || '{}');
    days = Object.keys(old.checks || {}).length;
  } catch (e) { days = 0; }
  openModal('<div class="m-head"><b>迁移旧版本数据</b><button class="icon-btn" data-action="closeModal" aria-label="关闭">' + icon('x') + '</button></div>' +
    '<div class="m-warn">' + icon('info') + '<div>检测到旧版本数据（' + found.join('、') + '），共 <b>' + days + '</b> 天打卡痕迹。<br><br>' +
    '旧版本的打卡项和新版的 8 条不是一一对应的，所以只能迁移「哪天有打卡」这一层痕迹：有记录的天会记为<b>部分完成</b>，具体是哪几项无法还原，也不会伪造达标。</div></div>' +
    '<div class="m-btns"><button class="btn ghost" data-action="closeModal">取消</button>' +
    '<button class="btn pri" data-action="confirmMigrate">迁移打卡痕迹</button></div>');
}
function confirmMigrateRun() {
  let old = null;
  for (const k of LEGACY_KEYS) {
    try { const raw = localStorage.getItem(k); if (raw) { old = JSON.parse(raw); break; } } catch (e) { }
  }
  if (!old || !old.checks) { toast('旧数据读取失败', 'warn'); return; }
  let n = 0;
  Object.keys(old.checks).forEach(d => {
    const arr = old.checks[d];
    if (!arr || !arr.length) return;
    if (state.checks[d] && state.checks[d].length) return;
    state.checks[d] = [state.acts[0].id];
    n++;
  });
  save(); closeModal(); refreshAll();
  toast('已迁移 ' + n + ' 天打卡痕迹', 'ok');
}
function doClearAll() {
  const inp = $('#clearInput');
  if (!inp || inp.value.trim() !== '清空') { toast('请输入「清空」两个字再点按钮', 'warn'); return; }
  openModal('<div class="m-head"><b>最后确认</b><button class="icon-btn" data-action="closeModal" aria-label="关闭">' + icon('x') + '</button></div>' +
    '<div class="m-warn">' + icon('trash') + '<div>全部 ' + Object.keys(state.checks).length + ' 天记录、成功日记、统计与目标都会被删除，<b>无法恢复</b>。<br>确定要清空吗？</div></div>' +
    '<div class="m-btns"><button class="btn ghost" data-action="closeModal">取消</button>' +
    '<button class="btn danger" data-action="confirmClear">确认清空</button></div>');
}

/* ================= 初始化 ================= */
function updateTimeMarks() {
  const card = document.getElementById('timetableCard');
  if (!card) return;
  const tmp = document.createElement('div');
  tmp.innerHTML = renderTimeTable();
  const fresh = tmp.firstElementChild;
  if (fresh) card.replaceWith(fresh);
}
function init() {
  try {
    const raw = localStorage.getItem(KEY);
    state = raw ? migrate(JSON.parse(raw)) : emptyData();
  } catch (e) {
    state = emptyData();
  }
  save();
  viewWeek = mondayOf(todayStr());
  viewMonth = monthKey(todayStr());
  refreshAll();
  const fi = $('#importFile');
  if (fi) fi.addEventListener('change', ev => {
    const f = ev.target.files && ev.target.files[0];
    if (f) doImport(f);
    ev.target.value = '';
  });
  /* 每分钟只刷新时间表的「进行中」标记，不重建整页，避免输入框失焦 */
  setInterval(() => { if (curTab === 'today') updateTimeMarks(); }, 60000);
}

document.addEventListener('DOMContentLoaded', init);
</script>
